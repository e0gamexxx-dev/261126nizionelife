<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>切り抜きまとめ</title>
<style>
:root{--bg:#eef2f7;--card:#fff;--ink:#1c2540;--sub:#5b6684;--line:#d5dce8;--acc:#0f766e;--acc-ink:#fff;--chip:#e3e9f3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121826;--card:#1b2336;--ink:#e8ecf5;--sub:#9aa5c0;--line:#2c3650;--acc:#2dd4bf;--acc-ink:#06201d;--chip:#273148;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121826;--card:#1b2336;--ink:#e8ecf5;--sub:#9aa5c0;--line:#2c3650;--acc:#2dd4bf;--acc-ink:#06201d;--chip:#273148;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;line-height:1.6}
.wrap{max-width:1200px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:1.6rem;margin:0 0 4px;letter-spacing:.02em}
.lead{margin:0 0 20px;color:var(--sub);font-size:.9rem}
#q,#lq{width:100%;padding:12px 14px;font-size:1rem;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
#q:focus-visible,#lq:focus-visible,.chip:focus-visible,.card:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 6px}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--ink);padding:6px 12px;border-radius:999px;font-size:.85rem;cursor:pointer;font-family:inherit}
.chip[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:700}
.chip .n{opacity:.65;margin-left:5px;font-size:.75rem}
.chip.more{background:none;border-style:dashed;color:var(--acc);font-weight:700}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:6px 0 10px}
.panel .tags{margin:10px 0 0;max-height:42vh;overflow:auto}
#lq{padding:9px 12px;font-size:.95rem}
.status{display:flex;justify-content:space-between;align-items:center;margin:10px 0 14px;font-size:.85rem;color:var(--sub);min-height:1.6em}
#clear{border:0;background:none;color:var(--acc);cursor:pointer;font-size:.85rem;font-family:inherit;text-decoration:underline}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
@media (max-width:560px){.grid{grid-template-columns:repeat(2,1fr);gap:10px}}
@media (max-width:380px){.grid{grid-template-columns:1fr}}
.card{position:relative;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.link{display:flex;flex-direction:column;flex:1;color:inherit;text-decoration:none}
.link:focus-visible{outline:3px solid var(--acc);outline-offset:-3px}
.fav,.mark{position:absolute;top:8px;border:0;cursor:pointer;font-family:inherit;background:rgba(0,0,0,.62);color:#fff}
.fav{right:8px;width:40px;height:40px;border-radius:50%;font-size:1.25rem;line-height:1;display:grid;place-items:center}
.fav.on{color:#ff6b8a}
.mark{left:8px;padding:6px 11px;border-radius:999px;font-size:.78rem;font-weight:700}
.mark.on{background:var(--acc);color:var(--acc-ink)}
.fav:focus-visible,.mark:focus-visible{outline:3px solid #fff;outline-offset:2px}
.card.seen .thumb{opacity:.5}
.card.seen .title{color:var(--sub)}
.card:hover{border-color:var(--acc)}
.thumb{aspect-ratio:16/9;display:grid;place-items:center;background:hsl(var(--h) 45% 38%);position:relative}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb svg{position:relative;width:38px;height:38px;fill:#fff;opacity:.95;filter:drop-shadow(0 1px 4px rgba(0,0,0,.6))}
.body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px;flex:1}
.title{font-size:.92rem;font-weight:700;margin:0;line-height:1.45;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden;overflow-wrap:anywhere}
.who{display:flex;flex-wrap:wrap;gap:4px;margin-top:auto}
.who span{font-size:.75rem;background:var(--chip);color:var(--sub);padding:2px 8px;border-radius:999px}
.who span.on{background:var(--acc);color:var(--acc-ink)}
.contact{margin:-12px 0 18px;font-size:.85rem;color:var(--sub)}
.contact a,.foot a{color:var(--acc);font-weight:700;text-decoration:underline;text-underline-offset:2px}
.foot{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);font-size:.78rem;line-height:1.8;color:var(--sub)}
.foot p{margin:0 0 6px}
.empty{grid-column:1/-1;text-align:center;color:var(--sub);padding:40px 0}
</style>
</head>
<body>
<div class="wrap">
  <h1>切り抜きまとめ</h1>
  <p class="lead">検索、またはライバーをタップで絞り込み</p>
  <p class="contact">お気づきの点があればこちらへ → <a href="https://x.com/e0gamexxx" target="_blank" rel="noopener">X（@e0gamexxx）</a></p>
  <input id="q" type="search" placeholder="タイトル・ライバー名で検索" aria-label="検索">
  <div class="tags" id="flt" role="group" aria-label="表示の絞り込み"></div>
  <div class="tags" id="tags" role="group" aria-label="ライバーで絞り込み"></div>
  <div class="panel" id="panel" hidden><input id="lq" type="search" placeholder="ライバー名を探す" aria-label="ライバー名を探す"><div class="tags" id="alltags" role="group" aria-label="全ライバー"></div></div>
  <div class="status"><span id="count"></span><button id="clear" hidden>絞り込みを解除</button></div>
  <div class="grid" id="grid"></div>
  <footer class="foot">
    <p>このサイトは、にじさんじの切り抜き動画を紹介する、非公式のファン運営のまとめサイトです。ANYCOLOR株式会社、所属ライバー、各動画の投稿者とは関係ありません。</p>
    <p>動画・サムネイル・タイトルの権利は、各投稿者およびANYCOLOR株式会社にあります。動画はYouTubeへのリンクで紹介しており、転載はしていません。</p>
    <p>掲載内容に関するご連絡・掲載の削除のご希望は、<a href="https://x.com/e0gamexxx" target="_blank" rel="noopener">X（@e0gamexxx）</a>までお願いします。</p>
  </footer>
</div>
<script>
// ▼ 動画データはGoogleスプレッドシートから読み込みます（1行目：url, livers, 任意で title）
// livers は複数ならカンマ区切り（例：ライバーA,ライバーB）。title が空ならYouTubeのタイトルを自動取得します。
const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRKx_6ZAtOwYtkBWlGMbhIRCu5Bi35dpH4OPcY7GfAECFJweC5SizgvByZmugx_rabikGBc0Oymc27O/pub?gid=0&single=true&output=csv";
let VIDEOS = [];
// ▲ ここまで

const $=id=>document.getElementById(id);
const norm=s=>s.toLowerCase().normalize("NFKC");
let allLivers=[];
const selected=new Set();
let query="";

function parseCSV(t){
  const rows=[];let row=[],f="",q=false;
  t=t.replace(/^\uFEFF/,"");
  for(let i=0;i<t.length;i++){
    const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;
    else if(c===","){row.push(f);f=""}
    else if(c==="\n"||c==="\r"){if(c==="\r"&&t[i+1]==="\n")i++;row.push(f);rows.push(row);row=[];f=""}
    else f+=c;
  }
  if(f!==""||row.length){row.push(f);rows.push(row)}
  return rows;
}
function parseSheet(t){
  const rows=parseCSV(t);
  const head=(rows.shift()||[]).map(h=>h.trim().toLowerCase());
  const ix=n=>head.indexOf(n);
  return rows.map(r=>({
    url:(r[ix("url")]||"").trim(),
    title:(r[ix("title")]||"").trim(),
    livers:(r[ix("livers")]||"").split(/[,、，／\/]/).map(x=>x.trim()).filter(Boolean)
  })).filter(v=>v.url);
}
async function init(){
  $("grid").innerHTML='<div class="empty">読み込み中…</div>';
  try{
    const r=await fetch(SHEET_URL+"&t="+Date.now());
    if(!r.ok)throw 0;
    VIDEOS=parseSheet(await r.text());
  }catch(e){
    $("grid").innerHTML='<div class="empty">スプレッドシートを読み込めませんでした。時間をおいて開き直してください。</div>';
    return;
  }
  allLivers=[...new Set(VIDEOS.flatMap(v=>v.livers))];
  counts={};VIDEOS.forEach(v=>new Set(v.livers).forEach(n=>counts[n]=(counts[n]||0)+1));
  sorted=[...allLivers].sort((a,b)=>counts[b]-counts[a]||a.localeCompare(b,"ja"));
  update();
  fetchTitles();
}
function shown(v){return v.title||v.fetched||"（タイトル取得中）"}
async function fetchTitles(){
  await Promise.all(VIDEOS.map(async v=>{
    if(v.title)return;
    try{
      const r=await fetch("https://www.youtube.com/oembed?format=json&url="+encodeURIComponent(v.url));
      if(!r.ok)throw 0;
      v.fetched=(await r.json()).title;
    }catch(e){v.fetched=v.url}
  }));
  render();
}
function vid(u){const m=u.match(/(?:youtu\.be\/|\/live\/|\/shorts\/|[?&]v=)([\w-]{11})/);return m?m[1]:null}
function hue(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h}

const TOP=8;
let open=false,counts={},sorted=[];
function chip(n){
  const b=document.createElement("button");
  b.className="chip";b.type="button";b.textContent=n;
  const c=document.createElement("span");c.className="n";c.textContent=counts[n]||0;b.appendChild(c);
  b.setAttribute("aria-pressed",selected.has(n));
  b.onclick=()=>{selected.has(n)?selected.delete(n):selected.add(n);update()};
  return b;
}
function renderTags(){
  const topSet=new Set(sorted.slice(0,TOP));
  const t=$("tags");t.innerHTML="";
  sorted.filter(n=>topSet.has(n)||selected.has(n)).forEach(n=>t.appendChild(chip(n)));
  const more=document.createElement("button");
  more.className="chip more";more.type="button";
  more.textContent="すべて（"+allLivers.length+"人）"+(open?"▲":"▼");
  more.setAttribute("aria-expanded",open);
  more.onclick=()=>{open=!open;update()};
  t.appendChild(more);
}
function renderPanel(){
  $("panel").hidden=!open;
  if(!open)return;
  const q=norm($("lq").value.trim());
  const box=$("alltags"),sc=box.scrollTop;box.innerHTML="";
  const list=sorted.filter(n=>!q||norm(n).includes(q));
  if(!list.length){box.innerHTML='<span class="empty" style="padding:8px 0">該当するライバーがいません</span>';return}
  list.forEach(n=>box.appendChild(chip(n)));
  box.scrollTop=sc;
}

const KEY_F="261126nizionelife:fav",KEY_S="261126nizionelife:seen";
function load(k){try{return new Set(JSON.parse(localStorage.getItem(k)||"[]"))}catch(e){return new Set()}}
function save(k,set){try{localStorage.setItem(k,JSON.stringify([...set]))}catch(e){}}
const favs=load(KEY_F),seen=load(KEY_S);
let favOnly=false,seenMode="";
function key(v){return vid(v.url)||v.url}

function renderFlt(){
  const f=$("flt");f.innerHTML="";
  const mk=(label,on,fn)=>{const b=document.createElement("button");b.className="chip";b.type="button";b.textContent=label;b.setAttribute("aria-pressed",on);b.onclick=fn;f.appendChild(b)};
  const nf=VIDEOS.filter(v=>favs.has(key(v))).length;
  mk("♥ お気に入り（"+nf+"）",favOnly,()=>{favOnly=!favOnly;update()});
  mk("未視聴",seenMode==="unseen",()=>{seenMode=seenMode==="unseen"?"":"unseen";update()});
  mk("視聴済み",seenMode==="seen",()=>{seenMode=seenMode==="seen"?"":"seen";update()});
}

function render(){
  const q=norm(query.trim());
  const list=VIDEOS.filter(v=>{
    const k=key(v);
    const okTag=[...selected].every(n=>v.livers.includes(n));
    const okQ=!q||norm(shown(v)+" "+v.livers.join(" ")).includes(q);
    const okFav=!favOnly||favs.has(k);
    const okSeen=!seenMode||(seenMode==="seen"?seen.has(k):!seen.has(k));
    return okTag&&okQ&&okFav&&okSeen;
  });
  $("count").textContent=list.length+"本の動画";
  $("clear").hidden=!(selected.size||q||favOnly||seenMode);
  const g=$("grid");g.innerHTML="";
  if(!list.length){
    const none=favOnly&&!favs.size?"お気に入りはまだありません。カードの ♡ を押すと追加できます。":"該当する動画がありません。条件を変えてみてください。";
    g.innerHTML='<div class="empty"></div>';g.firstChild.textContent=none;return;
  }
  list.forEach(v=>{
    const k=key(v);
    const card=document.createElement("div");
    card.className="card";
    const who=v.livers.map(n=>'<span class="'+(selected.has(n)?"on":"")+'"></span>').join("");
    card.innerHTML='<a class="link"><div class="thumb" style="--h:'+hue(v.url)+'"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg></div><div class="body"><h2 class="title"></h2><div class="who">'+who+'</div></div></a><button class="mark" type="button"></button><button class="fav" type="button"></button>';
    const a=card.querySelector(".link");a.href=v.url;a.target="_blank";a.rel="noopener";
    const tt=card.querySelector(".title");tt.textContent=shown(v);tt.title=shown(v);
    card.querySelectorAll(".who span").forEach((sp,i)=>sp.textContent=v.livers[i]);
    const id=vid(v.url);
    if(id){const im=document.createElement("img");im.src="https://i.ytimg.com/vi/"+id+"/hqdefault.jpg";im.alt="";im.loading="lazy";im.onerror=()=>im.remove();card.querySelector(".thumb").prepend(im)}
    const fav=card.querySelector(".fav"),mark=card.querySelector(".mark");
    const paint=()=>{
      const f=favs.has(k),m=seen.has(k);
      fav.textContent=f?"♥":"♡";fav.classList.toggle("on",f);fav.setAttribute("aria-pressed",f);fav.setAttribute("aria-label","お気に入り");
      mark.textContent=m?"✓ 見た":"見た";mark.classList.toggle("on",m);mark.setAttribute("aria-pressed",m);
      card.classList.toggle("seen",m);
    };
    const after=()=>{renderFlt();if(favOnly||seenMode)render();else paint()};
    fav.onclick=()=>{favs.has(k)?favs.delete(k):favs.add(k);save(KEY_F,favs);after()};
    mark.onclick=()=>{seen.has(k)?seen.delete(k):seen.add(k);save(KEY_S,seen);after()};
    paint();
    g.appendChild(card);
  });
}

function update(){renderFlt();renderTags();renderPanel();render()}
$("lq").addEventListener("input",renderPanel);
$("q").addEventListener("input",e=>{query=e.target.value;render()});
$("clear").onclick=()=>{selected.clear();query="";$("q").value="";favOnly=false;seenMode="";update()};
init();
</script>
</body>
</html>
